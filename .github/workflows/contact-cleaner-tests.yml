name: Contact Cleaner Tests

on:
  push:
    paths:
      - 'contact-cleaner/**'
      - '.github/workflows/contact-cleaner-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contact-cleaner
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: contact-cleaner/pom.xml
      - name: Run Maven tests
        run: mvn test --batch-mode
